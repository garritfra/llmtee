# llmtee with PostgreSQL instead of SQLite (e.g. for several proxy instances).
#   docker compose -f deploy/docker-compose.postgres.yml up -d
services:
  llmtee:
    image: ghcr.io/garritfra/llmtee:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://llmtee:${POSTGRES_PASSWORD:-llmtee}@postgres:5432/llmtee?sslmode=disable
      LLMTEE_ADMIN_PASSWORD: ${LLMTEE_ADMIN_PASSWORD:-change-me}

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmtee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmtee}
      POSTGRES_DB: llmtee
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "llmtee"]
      interval: 5s
      retries: 10

volumes:
  pg-data:
