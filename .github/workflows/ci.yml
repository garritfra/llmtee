name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # v2.15.0's linux-amd64 release asset returns HTTP 504; see #1.
          version: v2.14.0

  test:
    name: test (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: llmtee
          POSTGRES_PASSWORD: llmtee
          POSTGRES_DB: llmtee
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U llmtee" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_URL: postgres://llmtee:llmtee@localhost:5432/llmtee?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Unit, golden and end-to-end tests
        run: |
          if [ "${{ matrix.db }}" = postgres ]; then
            export LLMTEE_TEST_POSTGRES_URL="$PG_URL" LLMTEE_REQUIRE_POSTGRES=1
          fi
          go test -race -count=1 ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SDK integration tests (Python, TypeScript)
        run: |
          pip install -r integration/python/requirements.txt
          if [ "${{ matrix.db }}" = postgres ]; then export DATABASE_URL="$PG_URL"; fi
          integration/run.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: llmtee:ci
      - name: Image size and smoke test
        run: |
          cid=$(docker create llmtee:ci)
          size=$(docker export "$cid" | wc -c)
          docker rm "$cid"
          echo "image size (unpacked): $((size / 1024 / 1024)) MiB"
          test "$size" -lt $((30 * 1024 * 1024))
          docker run -d --name llmtee -p 8080:8080 -e LLMTEE_ADMIN_PASSWORD=ci llmtee:ci
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz | grep -Fx '{"status":"ok"}'
          docker stats --no-stream llmtee

  # Moving :main tag. Previous builds stay pullable by digest; only the 5 newest are kept.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, docker]
    runs-on: ubuntu-latest
    concurrency: publish-main
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:main
          build-args: COMMIT=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      # Untagged only: release tags (x.y.z, latest) and :main are never touched.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-untagged: 5
